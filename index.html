<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E-Perpus Pinky</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

:root{
    --pink1:#ff85a2;
    --pink2:#fbb1bd;
    --pink3:#fff0f5;
    --pink4:#d63384;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:var(--pink3);
    display:flex;
    justify-content:center;
    min-height:100vh;
}

.mobile-container{
    width:100%;
    max-width:450px;
    background:white;
    min-height:100vh;
    box-shadow:0 0 20px rgba(0,0,0,0.1);
}

header{
    background:linear-gradient(135deg,var(--pink1),var(--pink4));
    color:white;
    text-align:center;
    padding:25px;
    border-bottom-left-radius:30px;
    border-bottom-right-radius:30px;
}

header h1{
    font-size:45px;
}

#jam{
    margin-top:15px;
    font-size:18px;
}

.dark-btn{
    margin-top:20px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:white;
    color:var(--pink4);
    font-weight:bold;
    font-size:18px;
}

.content{
    padding:20px;
}

.card{
    border:2px solid #efb3c2;
    border-radius:25px;
    padding:20px;
    margin-bottom:25px;
}

h3{
    color:var(--pink4);
    font-size:26px;
    margin-bottom:20px;
}

select,input{
    width:100%;
    padding:16px;
    border-radius:18px;
    border:2px solid #efb3c2;
    margin-top:15px;
    font-size:18px;
    outline:none;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:18px;
    margin-top:20px;
    background:var(--pink1);
    color:white;
    font-weight:bold;
    font-size:18px;
}

button:hover{
    background:var(--pink4);
}

.hidden{
    display:none;
}

.status-box{
    background:#fff0f5;
    padding:20px;
    border-radius:20px;
    line-height:2;
    font-size:18px;
}

#coverBuku{
    width:120px;
    display:block;
    margin:auto;
    margin-top:15px;
    border-radius:15px;
}

.table-container{
    overflow-x:auto;
    margin-top:15px;
}

table{
    border-collapse:collapse;
    min-width:1000px;
    width:100%;
}

th{
    background:var(--pink1);
    color:white;
    padding:14px;
    text-align:center;
    font-size:16px;
    white-space:nowrap;
}

td{
    border:1px solid #ddd;
    padding:14px;
    text-align:center;
    white-space:nowrap;
    font-size:15px;
}

.action-btn{
    border:none;
    border-radius:10px;
    padding:8px 12px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin:2px;
}

.hijau{
    background:#28a745;
}

.selesai{
    text-decoration:line-through;
    opacity:0.6;
}

footer{
    text-align:center;
    padding:30px;
    color:#888;
    font-size:18px;
}

.download-btn{
    background:#28a745;
}

.delete-btn{
    background:#dc3545;
}

.dark{
    background:#1e1e1e;
}

.dark .mobile-container{
    background:#2b2b2b;
    color:white;
}

.dark .card{
    background:#333;
}

.dark input,
.dark select{
    background:#444;
    color:white;
}

.dark .status-box{
    background:#444;
}

</style>
</head>

<body>

<div class="mobile-container">

<header>

<h1>📚 E-Perpus Pinky</h1>
<p>Tugas Informatika Kelas 11</p>

<div id="jam"></div>

<button class="dark-btn" onclick="darkMode()">
🌙 Dark Mode
</button>

</header>

<div class="content">

<!-- STEP 1 -->

<div id="step1" class="card">

<h3>1. Cari Buku</h3>

<select id="cariBuku" onchange="tampilCover()">

<option value="">-- Pilih Buku --</option>

<option>Pen. Agama Islam</option>
<option>PKN</option>
<option>Bahasa Indonesia</option>
<option>Bahasa Inggris</option>
<option>Seni Budaya</option>
<option>PJOK</option>
<option>Matematika</option>
<option>Fisika</option>
<option>Sejarah Indonesia</option>
<option>Biologi</option>
<option>Kimia</option>
<option>Informatika</option>

</select>

<input type="number" id="jumlahBuku" placeholder="Jumlah Buku" min="1">

<img id="coverBuku"
src="https://via.placeholder.com/120x170/ff85a2/ffffff?text=Buku">

<button onclick="nextStep(2)">
Cari & Ambil Buku
</button>

</div>

<!-- STEP 2 -->

<div id="step2" class="card hidden">

<h3>2. Cek Kondisi Buku</h3>

<label>
<input type="checkbox"
id="kondisiBuku"
style="width:auto;">
 Buku dalam kondisi baik
</label>

<button onclick="checkKondisi()">
Lanjut ke Petugas
</button>

</div>

<!-- STEP 3 -->

<div id="step3" class="card hidden">

<h3>3. Data Peminjaman</h3>

<select id="kelasSelect" onchange="loadNama()">

<option value="">-- Pilih Kelas --</option>

<option>XI-1</option>
<option>XI-2</option>
<option>XI-3</option>
<option>XI-4</option>
<option>XI-5</option>
<option>XI-6</option>
<option>XI-7</option>
<option>XI-8</option>
<option>XI-9</option>
<option>XI-10</option>

</select>

<input
type="text"
id="searchNama"
placeholder="🔍 Pilih atau cari nama siswa..."
onkeyup="filterNama()"
>

<select id="namaSiswa"></select>

<button onclick="prosesPinjam()">
Konfirmasi Peminjaman
</button>

</div>

<!-- STEP 4 -->

<div id="step4" class="card hidden">

<h3>4. Status Peminjaman</h3>

<div id="detailPinjam" class="status-box"></div>

<button onclick="prosesKembali()">
Kembalikan Buku
</button>

<button onclick="peminjamanBaru()">
➕ Buat Peminjaman Baru
</button>

</div>

<!-- RIWAYAT -->

<div class="card">

<h3>📋 Riwayat Peminjaman</h3>

<div class="table-container">

<table>

<thead>

<tr>
<th>No</th>
<th>Nama</th>
<th>Kelas</th>
<th>Buku</th>
<th>Jumlah</th>
<th>Tanggal</th>
<th>Jam</th>
<th>Status</th>
<th>Selesai</th>
</tr>

</thead>

<tbody id="riwayatTable">

</tbody>

</table>

</div>

<button class="download-btn" onclick="downloadExcel()">
📥 Download Excel
</button>

<button class="delete-btn" onclick="hapusSemuaRiwayat()">
🗑 Hapus Semua Riwayat
</button>

</div>

</div>

<footer>
Dibuat Oleh Fahrul Lamusu
</footer>

</div>

<script>

let db = {};

const siswaXI2 = [

"Abdul Rizki Rafa Hiola",
"Aira Mohi",
"Almira Juniara Tilahunga",
"Amelia H. Radzak",
"Annisa Salsabila Badu",
"Ardiansyah Ismail",
"Artika Latiman",
"Balqis Aurelia Susanto",
"Chelsea Ishak",
"Cholid Azzam Surantinojo",
"Fadel Nur Rizki Wakid",
"Fahrul Lamusu",
"Fakhriansyah Eka Tabri",
"Fatriyaningsih Putri Yasin",
"Fauzan Fatih Tolinggilo",
"Fauzia Nurazizah Rauf",
"Indah Cahyaning Wulan",
"Jenny Mulyani Hasan",
"Jesika Jamalu",
"Kanaya Gufranai Kai",
"Khumaira Umar",
"Moh. Adi Firdaus",
"Moh. Farel Ali",
"Moh. Ilyansyah Kaharu",
"Moh. Rayhan Panggi",
"Moh. Ridho Prasetyo Lasaleng",
"Mutmainah Dali",
"Nabila Putri Amara",
"Navila Cahyani Masi",
"Nazwa Kirana",
"Nurain Nggadu",
"Putri Nuraini Nento",
"Sarah Zetira Alaydrus",
"Shawwan Sobri I. Maunty",
"Siti Aura Rivai"

];

setInterval(()=>{

let now = new Date();

document.getElementById("jam").innerHTML =
now.toLocaleTimeString('id-ID',{
hour:'2-digit',
minute:'2-digit'
});

},1000);

function darkMode(){

document.body.classList.toggle("dark");

}

function tampilCover(){

let buku =
document.getElementById("cariBuku").value;

document.getElementById("coverBuku").src =
"https://via.placeholder.com/120x170/ff85a2/ffffff?text="
+ encodeURIComponent(buku);

}

function nextStep(step){

document
.querySelectorAll("#step1,#step2,#step3,#step4")
.forEach(card=>{

card.classList.add("hidden");

});

document
.getElementById("step"+step)
.classList.remove("hidden");

}

function checkKondisi(){

let ok =
document.getElementById("kondisiBuku").checked;

if(ok){

nextStep(3);

}else{

alert("Buku rusak!");

}

}

function loadNama(){

let kelas =
document.getElementById("kelasSelect").value;

let select =
document.getElementById("namaSiswa");

select.innerHTML = "";

if(kelas === "XI-2"){

siswaXI2.forEach(nama=>{

let option =
document.createElement("option");

option.text = nama;

select.add(option);

});

}else{

let option =
document.createElement("option");

option.text = "Belum ada daftar nama";

select.add(option);

}

}

function filterNama(){

let input =
document.getElementById("searchNama").value.toLowerCase();

let select =
document.getElementById("namaSiswa");

for(let i=0;i<select.options.length;i++){

let txt =
select.options[i].text.toLowerCase();

select.options[i].style.display =
txt.includes(input) ? "" : "none";

}

}

function prosesPinjam(){

let nama =
document.getElementById("namaSiswa").value;

let kelas =
document.getElementById("kelasSelect").value;

let buku =
document.getElementById("cariBuku").value;

let jumlah =
document.getElementById("jumlahBuku").value;

if(!nama || !kelas || !buku || !jumlah){

alert("Lengkapi data!");

return;

}

let tgl = new Date();

let tanggal =
tgl.toLocaleDateString('id-ID');

let jam =
tgl.toLocaleTimeString('id-ID',{
hour:'2-digit',
minute:'2-digit'
});

db = {
nama,
kelas,
buku,
jumlah,
tanggal,
jam,
status:"Dipinjam"
};

document.getElementById("detailPinjam").innerHTML =

`
<b>Nama:</b> ${nama}<br>
<b>Kelas:</b> ${kelas}<br>
<b>Buku:</b> ${buku}<br>
<b>Jumlah:</b> ${jumlah}<br>
<b>Tanggal:</b> ${tanggal}<br>
<b>Jam:</b> ${jam}
`;

simpanRiwayat(db);

loadRiwayat();

nextStep(4);

}

function simpanRiwayat(data){

let riwayat =
JSON.parse(localStorage.getItem("riwayatPeminjaman")) || [];

riwayat.push(data);

localStorage.setItem(
"riwayatPeminjaman",
JSON.stringify(riwayat)
);

}

function loadRiwayat(){

let riwayat =
JSON.parse(localStorage.getItem("riwayatPeminjaman")) || [];

let table =
document.getElementById("riwayatTable");

table.innerHTML = "";

riwayat.forEach((item,index)=>{

table.innerHTML += `

<tr class="${item.status==='Selesai'?'selesai':''}">

<td>${index+1}</td>
<td>${item.nama}</td>
<td>${item.kelas}</td>
<td>${item.buku}</td>
<td>${item.jumlah}</td>
<td>${item.tanggal}</td>
<td>${item.jam}</td>
<td>${item.status}</td>

<td>

<button
class="action-btn hijau"
onclick="selesaiPinjam(${index})">

✔

</button>

</td>

</tr>

`;

});

}

function selesaiPinjam(index){

let riwayat =
JSON.parse(localStorage.getItem("riwayatPeminjaman"));

riwayat[index].status = "Selesai";

localStorage.setItem(
"riwayatPeminjaman",
JSON.stringify(riwayat)
);

loadRiwayat();

}

function prosesKembali(){

alert("Buku berhasil dikembalikan!");

}

function peminjamanBaru(){

document.getElementById("cariBuku").value="";
document.getElementById("jumlahBuku").value="";
document.getElementById("kelasSelect").value="";
document.getElementById("searchNama").value="";
document.getElementById("namaSiswa").innerHTML="";
document.getElementById("kondisiBuku").checked=false;

nextStep(1);

}

function hapusSemuaRiwayat(){

if(confirm("Hapus semua riwayat?")){

localStorage.removeItem("riwayatPeminjaman");

loadRiwayat();

}

}

function downloadExcel(){

let data =
JSON.parse(localStorage.getItem("riwayatPeminjaman")) || [];

if(data.length===0){

alert("Belum ada riwayat!");

return;

}

const wb = XLSX.utils.book_new();

let excelData = [];

excelData.push([
"No",
"Nama",
"Kelas",
"Buku",
"Jumlah",
"Tanggal",
"Jam",
"Status"
]);

data.forEach((item,index)=>{

excelData.push([
index+1,
item.nama,
item.kelas,
item.buku,
item.jumlah,
item.tanggal,
item.jam,
item.status
]);

});

const ws =
XLSX.utils.aoa_to_sheet(excelData);

ws['!cols'] = [
{wch:5},
{wch:35},
{wch:12},
{wch:25},
{wch:10},
{wch:15},
{wch:10},
{wch:15}
];

XLSX.utils.book_append_sheet(
wb,
ws,
"Riwayat Peminjaman"
);

XLSX.writeFile(
wb,
"Laporan_Riwayat_Peminjaman.xlsx"
);

}

loadRiwayat();

</script>

</body>
    </html>
